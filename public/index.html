<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ludo Emperor 4 Way — Global Multiplayer</title>
    <style>
      :root {
        --bg: #0f172a;
        --bg-2: #111827;
        --panel: #1f2937;
        --text: #f8fafc;
        --muted: #cbd5e1;
        --accent: #f59e0b;
        --success: #22c55e;
        --danger: #ef4444;
      }

      * { box-sizing: border-box; }

      body {
        margin: 0;
        min-height: 100vh;
        background: radial-gradient(circle at top, #1e293b 0%, var(--bg) 55%);
        color: var(--text);
        font-family: Arial, sans-serif;
        display: grid;
        place-items: center;
      }

      .shell {
        width: min(980px, calc(100vw - 32px));
        background: rgba(17, 24, 39, 0.95);
        border: 1px solid rgba(255,255,255,0.08);
        border-radius: 18px;
        box-shadow: 0 30px 80px rgba(0,0,0,0.45);
        padding: 24px;
      }

      h1 { margin-top: 0; }

      .row {
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
        margin: 18px 0;
      }

      input, button {
        border: none;
        border-radius: 12px;
        padding: 12px 14px;
        font-size: 16px;
      }

      input {
        min-width: 240px;
        background: var(--panel);
        color: var(--text);
      }

      button {
        font-weight: bold;
        cursor: pointer;
        background: var(--accent);
        color: #111827;
      }

      button.secondary {
        background: var(--success);
        color: #052e16;
      }

      button.danger {
        background: var(--danger);
        color: white;
      }

      .status {
        margin-top: 18px;
        padding: 16px;
        border-radius: 12px;
        background: rgba(148,163,184,.08);
        color: var(--muted);
      }

      .badge {
        display: inline-block;
        padding: 8px 12px;
        border-radius: 999px;
        background: rgba(34,197,94,.12);
        color: #ccfbf1;
        border: 1px solid rgba(34,197,94,.2);
      }

      .players {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        margin-top: 18px;
      }

      .pill {
        padding: 8px 12px;
        border-radius: 999px;
        background: rgba(59,130,246,.12);
        border: 1px solid rgba(59,130,246,.25);
      }

      .game-box {
        margin-top: 20px;
        border: 1px solid rgba(255,255,255,0.08);
        background: rgba(15, 23, 42, 0.7);
        padding: 16px;
        border-radius: 14px;
      }

      .hidden {
        display: none;
      }
    </style>
  </head>
  <body>
    <div class="shell">
      <h1>Ludo Emperor 4 Way</h1>
      <div class="badge">Global multiplayer room lobby</div>

      <div class="row">
        <input id="playerName" type="text" maxlength="20" placeholder="Your name" value="Player" />
      </div>

      <div class="row">
        <button id="createBtn">Create room</button>
        <input id="roomCode" type="text" maxlength="8" placeholder="Enter room code" />
        <button class="secondary" id="joinBtn">Join room</button>
      </div>

      <div id="statusBox" class="status">Ready to create or join a room.</div>

      <div class="game-box">
        <strong>Instructions</strong>
        <p>1. Create a room and share the code.</p>
        <p>2. Friends join with the same room code.</p>
        <p>3. Everyone enters the game board together.</p>
      </div>
    </div>

    <script>
      const statusBox = document.getElementById('statusBox');
      const playerInput = document.getElementById('playerName');
      const roomInput = document.getElementById('roomCode');
      const createBtn = document.getElementById('createBtn');
      const joinBtn = document.getElementById('joinBtn');

      function setStatus(message, isError = false) {
        statusBox.textContent = message;
        statusBox.style.color = isError ? '#fecaca' : '#cbd5e1';
      }

      function savePlayerName() {
        const value = (playerInput.value || 'Player').trim() || 'Player';
        localStorage.setItem('playerName', value);
        playerInput.value = value;
      }

      async function createRoom() {
        savePlayerName();
        createBtn.disabled = true;
        joinBtn.disabled = true;
        setStatus('Creating room...');

        try {
          const res = await fetch('/api/rooms/create', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ playerName: playerInput.value })
          });

          const data = await res.json();
          if (!res.ok || !data.roomCode) {
            throw new Error(data.message || 'Could not create room');
          }

          localStorage.setItem('playerName', playerInput.value);
          localStorage.setItem('currentRoom', data.roomCode);
          setStatus(`Room created! Code: ${data.roomCode} — opening game...`);
          window.location.href = `game.html?room=${data.roomCode}`;
        } catch (error) {
          setStatus(error.message || 'Failed to create room', true);
        } finally {
          createBtn.disabled = false;
          joinBtn.disabled = false;
        }
      }

      async function joinRoom() {
        savePlayerName();
        const roomCode = (roomInput.value || '').trim().toUpperCase();

        if (!roomCode) {
          setStatus('Please enter a room code.', true);
          return;
        }

        createBtn.disabled = true;
        joinBtn.disabled = true;
        setStatus(`Joining room ${roomCode}...`);

        try {
          const res = await fetch('/api/rooms/join', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ roomCode, playerName: playerInput.value })
          });

          const data = await res.json();
          if (!res.ok) {
            throw new Error(data.message || 'Could not join room');
          }

          localStorage.setItem('playerName', playerInput.value);
          localStorage.setItem('currentRoom', roomCode);
          setStatus(`Joined room ${roomCode} — opening game...`);
          window.location.href = `game.html?room=${roomCode}`;
        } catch (error) {
          setStatus(error.message || 'Failed to join room', true);
        } finally {
          createBtn.disabled = false;
          joinBtn.disabled = false;
        }
      }

      const savedName = localStorage.getItem('playerName');
      if (savedName) playerInput.value = savedName;

      const urlRoom = new URLSearchParams(window.location.search).get('room');
      if (urlRoom) roomInput.value = urlRoom.toUpperCase();

      createBtn.addEventListener('click', createRoom);
      joinBtn.addEventListener('click', joinRoom);
      playerInput.addEventListener('keydown', (event) => {
        if (event.key === 'Enter') createRoom();
      });
      roomInput.addEventListener('keydown', (event) => {
        if (event.key === 'Enter') joinRoom();
      });
    </script>
  </body>
</html>
