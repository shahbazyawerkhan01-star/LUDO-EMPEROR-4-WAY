<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="theme-color" content="#0a0f26" />
    <title>Ludo Emperor 4 Way — Game</title>
    <style>
      :root {
        --bg: #0a0f26;
        --panel: #111827;
        --panel-2: #1f2937;
        --line: #334155;
        --text: #f8fafc;
        --muted: #cbd5e1;
        --red: #dc2626;
        --green: #22c55e;
        --yellow: #facc15;
        --blue: #3b82f6;
      }

      * { box-sizing: border-box; }

      body {
        margin: 0;
        background: #0a0f26;
        color: var(--text);
        font-family: Arial, sans-serif;
        overflow: hidden;
      }

      #app-container {
        width: 100vw;
        height: 100vh;
        display: flex;
        flex-direction: column;
        background: linear-gradient(180deg, #0a0f26 0%, #0b122a 100%);
      }

      .header {
        background: rgba(26,31,58,0.95);
        border-bottom: 1px solid #2c3552;
        padding: 12px 18px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 16px;
        flex-wrap: wrap;
      }

      .room-info {
        display: flex;
        flex-wrap: wrap;
        gap: 16px;
        align-items: center;
      }

      .room-code {
        background: rgba(59,130,246,0.18);
        border: 1px solid rgba(96,165,250,0.4);
        color: #dbeafe;
        padding: 6px 10px;
        border-radius: 999px;
        font-weight: 700;
        letter-spacing: 0.08em;
      }

      .players-list {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
      }

      .player-badge {
        background: rgba(148,163,184,0.12);
        color: var(--text);
        border: 1px solid rgba(148,163,184,0.4);
        padding: 6px 10px;
        border-radius: 999px;
        font-size: 12px;
      }

      .status-card {
        min-width: 180px;
        text-align: right;
        color: var(--muted);
        font-size: 13px;
      }

      .content {
        flex: 1;
        display: flex;
        align-items: stretch;
        justify-content: center;
        gap: 18px;
        padding: 18px;
      }

      .board-area {
        flex: 1;
        min-width: 380px;
        display: flex;
        justify-content: center;
        align-items: center;
      }

      .board {
        width: min(72vmin, 620px);
        aspect-ratio: 1;
        background: #f4f4f4;
        border-radius: 18px;
        box-shadow: 0 20px 60px rgba(0,0,0,0.45);
        position: relative;
        overflow: hidden;
        border: 6px solid #1a1f3a;
      }

      .board-grid {
        position: absolute;
        inset: 0;
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        grid-template-rows: repeat(3, 1fr);
        background: #f4f4f4;
      }

      .quadrant {
        position: relative;
        border: 2px solid rgba(15, 23, 42, 0.35);
      }

      .quadrant.red { background: #dd3f3f; }
      .quadrant.green { background: #39b35f; }
      .quadrant.yellow { background: #f2c948; }
      .quadrant.blue { background: #35b6d9; }

      .center {
        position: absolute;
        inset: 33%;
        background: #0f172a;
        border-radius: 20px;
        border: 6px solid rgba(255,255,255,0.15);
        display: grid;
        place-items: center;
        z-index: 2;
      }

      .dice {
        position: absolute;
        width: 140px;
        height: 140px;
        left: 50%;
        top: 50%;
        transform: translate(-50%, -50%);
        background: #0f172a;
        border-radius: 18px;
        border: 4px solid rgba(255,255,255,0.2);
        display: grid;
        place-items: center;
        z-index: 3;
        box-shadow: 0 18px 40px rgba(0,0,0,0.25);
      }

      .dice-face {
        width: 110px;
        height: 110px;
        border-radius: 14px;
        background: rgba(15, 23, 42, 0.92);
        display: grid;
        place-items: center;
        font-size: 52px;
        font-weight: 800;
        color: white;
      }

      .home-spot {
        position: absolute;
        width: 48%;
        height: 48%;
        border-radius: 50%;
        background: rgba(255,255,255,0.8);
        box-shadow: inset 0 0 0 14px rgba(15, 23, 42, 0.04);
      }

      .home-spot.red { left: 10%; top: 10%; }
      .home-spot.green { right: 10%; top: 10%; }
      .home-spot.yellow { left: 10%; bottom: 10%; }
      .home-spot.blue { right: 10%; bottom: 10%; }

      .sidebar {
        width: min(320px, 35vw);
        min-width: 260px;
        background: rgba(17,24,39,0.7);
        border: 1px solid rgba(148,163,184,0.18);
        border-radius: 18px;
        padding: 18px;
        display: flex;
        flex-direction: column;
        gap: 14px;
      }

      .panel-title {
        margin: 0 0 8px 0;
        font-size: 18px;
      }

      .players-wrap {
        display: flex;
        flex-direction: column;
        gap: 8px;
      }

      .player-row {
        display: flex;
        justify-content: space-between;
        align-items: center;
        background: rgba(148,163,184,0.06);
        border: 1px solid rgba(148,163,184,0.12);
        border-radius: 10px;
        padding: 8px 10px;
      }

      .player-name {
        font-weight: 700;
      }

      .player-color {
        width: 12px;
        height: 12px;
        border-radius: 50%;
        display: inline-block;
        margin-right: 8px;
        vertical-align: middle;
      }

      .controls {
        display: flex;
        flex-direction: column;
        gap: 10px;
      }

      button {
        appearance: none;
        border: none;
        border-radius: 12px;
        padding: 12px 14px;
        font-size: 16px;
        font-weight: 800;
        cursor: pointer;
      }

      .primary {
        background: linear-gradient(180deg, #fbbf24, #f59e0b);
        color: #111827;
      }

      .secondary {
        background: rgba(34,197,94,0.16);
        color: #dcfce7;
        border: 1px solid rgba(34,197,94,0.3);
      }

      .danger {
        background: rgba(239,68,68,0.16);
        color: #fecaca;
        border: 1px solid rgba(239,68,68,0.3);
      }

      .meta-box {
        background: rgba(148,163,184,0.06);
        border: 1px solid rgba(148,163,184,0.12);
        border-radius: 10px;
        padding: 12px;
        color: var(--muted);
      }

      .meta-box strong {
        color: var(--text);
      }

      @media (max-width: 900px) {
        .content {
          flex-direction: column;
          align-items: center;
          overflow: auto;
        }

        .sidebar {
          width: min(760px, 100%);
          min-width: unset;
        }
      }
    </style>
  </head>
  <body>
    <div id="app-container">
      <div class="header">
        <div class="room-info">
          <div class="room-code" id="roomCodeLabel">ROOM --</div>
          <div class="players-list" id="playersList"></div>
        </div>
        <div class="status-card" id="statusText">Connecting...</div>
      </div>

      <div class="content">
        <div class="board-area">
          <div class="board" aria-label="Ludo board">
            <div class="board-grid">
              <div class="quadrant red"></div>
              <div class="quadrant green"></div>
              <div class="quadrant red"></div>
              <div class="quadrant yellow"></div>
              <div class="center"><div class="dice-face" id="centerToken">◎</div></div>
              <div class="quadrant blue"></div>
              <div class="quadrant yellow"></div>
              <div class="quadrant blue"></div>
              <div class="quadrant green"></div>
            </div>

            <div class="home-spot red"></div>
            <div class="home-spot green"></div>
            <div class="home-spot yellow"></div>
            <div class="home-spot blue"></div>

            <div class="dice" aria-live="polite">
              <div class="dice-face" id="diceValue">-</div>
            </div>
          </div>
        </div>

        <aside class="sidebar">
          <div>
            <h2 class="panel-title">Players</h2>
            <div class="players-wrap" id="playerPanel"></div>
          </div>

          <div class="controls">
            <button class="primary" id="rollBtn">Roll Dice</button>
            <button class="secondary" id="refreshBtn">Refresh Room</button>
            <button class="danger" id="leaveBtn">Leave</button>
          </div>

          <div class="meta-box">
            <div><strong>Room:</strong> <span id="metaRoom">--</span></div>
            <div><strong>Turn:</strong> <span id="metaTurn">Waiting</span></div>
            <div><strong>Last roll:</strong> <span id="metaRoll">—</span></div>
          </div>
        </aside>
      </div>
    </div>

    <script>
      const roomCode = new URLSearchParams(window.location.search).get('room') || localStorage.getItem('currentRoom');
      const playerName = localStorage.getItem('playerName') || 'Player';
      const wsBase = (location.protocol === 'https:' ? 'wss://' : 'ws://') + location.host;

      const state = {
        roomCode: roomCode || '',
        players: [],
        turn: 0,
        dice: null,
        lastRollBy: '',
        phase: 'lobby'
      };

      const roomCodeLabel = document.getElementById('roomCodeLabel');
      const playersList = document.getElementById('playersList');
      const playerPanel = document.getElementById('playerPanel');
      const statusText = document.getElementById('statusText');
      const diceValue = document.getElementById('diceValue');
      const metaRoom = document.getElementById('metaRoom');
      const metaTurn = document.getElementById('metaTurn');
      const metaRoll = document.getElementById('metaRoll');
      const rollBtn = document.getElementById('rollBtn');
      const refreshBtn = document.getElementById('refreshBtn');
      const leaveBtn = document.getElementById('leaveBtn');

      let socket = null;
      let connected = false;

      function setStatus(message) {
        statusText.textContent = message;
      }

      function renderPlayers() {
        const players = Array.isArray(state.players) ? state.players : [];

        playersList.innerHTML = '';
        playerPanel.innerHTML = '';

        players.forEach((player, index) => {
          const badge = document.createElement('div');
          badge.className = 'player-badge';
          badge.textContent = player.name || `Player ${index + 1}`;
          if (player.name === playerName) badge.style.borderColor = '#fbbf24';
          playersList.appendChild(badge);

          const playerRow = document.createElement('div');
          playerRow.className = 'player-row';
          playerRow.innerHTML = `
            <span class="player-name"><span class="player-color" style="background:${['#ef4444','#22c55e','#facc15','#3b82f6'][index % 4]}"></span>${player.name || `Player ${index + 1}`}</span>
            <span>${player.name === playerName ? 'You' : 'Guest'}</span>
          `;
          playerPanel.appendChild(playerRow);
        });

        if (!players.length) {
          const empty = document.createElement('div');
          empty.className = 'player-row';
          empty.textContent = 'Waiting for players...';
          playerPanel.appendChild(empty);
        }

        roomCodeLabel.textContent = `ROOM ${state.roomCode || roomCode || '--'}`;
        metaRoom.textContent = state.roomCode || roomCode || '--';
      }

      function renderGame() {
        renderPlayers();
        const players = Array.isArray(state.players) ? state.players : [];
        const turnPlayer = players[state.turn % players.length] || null;
        metaTurn.textContent = turnPlayer ? `${turnPlayer.name}'s turn` : 'Waiting';
        metaRoll.textContent = state.lastRollBy ? `${state.lastRollBy} rolled ${state.dice}` : '—';
        diceValue.textContent = state.dice ?? '-';
      }

      function sendSocket(payload) {
        if (socket && socket.readyState === WebSocket.OPEN) {
          socket.send(JSON.stringify(payload));
        }
      }

      function syncLocalState(roomData) {
        if (!roomData) return;
        state.roomCode = roomData.roomCode || state.roomCode;
        state.players = Array.isArray(roomData.players) ? roomData.players : state.players;
        state.phase = roomData.state && roomData.state.phase ? roomData.state.phase : state.phase;
        const incomingState = roomData.state || {};
        if (typeof incomingState.turn === 'number') state.turn = incomingState.turn;
        if (typeof incomingState.dice === 'number') state.dice = incomingState.dice;
        if (incomingState.lastRollBy) state.lastRollBy = incomingState.lastRollBy;
        renderGame();
      }

      function sendGameState() {
        const roomPlayers = Array.isArray(state.players) ? state.players : [];
        const payload = {
          type: 'game-state',
          roomCode: state.roomCode,
          state: {
            phase: state.phase,
            players: roomPlayers,
            turn: state.turn,
            dice: state.dice,
            lastRollBy: state.lastRollBy
          }
        };
        sendSocket(payload);
      }

      function rollDice() {
        const players = Array.isArray(state.players) ? state.players : [];
        if (!players.length) {
          setStatus('No players in room yet.');
          return;
        }

        const result = Math.ceil(Math.random() * 6);
        state.dice = result;
        state.lastRollBy = playerName;
        state.turn = (state.turn + 1) % players.length;
        state.phase = 'playing';
        renderGame();
        sendGameState();
        setStatus(`${playerName} rolled ${result}.`);
      }

      function connectSocket() {
        if (!roomCode) {
          window.location.href = '/';
          return;
        }

        socket = new WebSocket(wsBase);

        socket.addEventListener('open', () => {
          connected = true;
          setStatus('Connected to room');
          sendSocket({ type: 'join-room', roomCode, playerName });
          refreshRoom();
        });

        socket.addEventListener('message', (event) => {
          try {
            const message = JSON.parse(event.data);
            if (message.type === 'room-update') {
              syncLocalState(message);
              setStatus(`Room sync: ${message.players?.length || 0} players online`);
            }

            if (message.type === 'game-state') {
              const incoming = message.state || {};
              state.roomCode = message.roomCode || state.roomCode;
              state.phase = incoming.phase || state.phase;
              state.players = Array.isArray(incoming.players) ? incoming.players : state.players;
              state.turn = typeof incoming.turn === 'number' ? incoming.turn : state.turn;
              state.dice = typeof incoming.dice === 'number' ? incoming.dice : state.dice;
              state.lastRollBy = incoming.lastRollBy || state.lastRollBy;
              renderGame();
              setStatus(`Live update from room ${state.roomCode}`);
            }

            if (message.type === 'error') {
              setStatus(message.message || 'Room error', true);
            }
          } catch (error) {
            console.error('Socket parse error:', error);
          }
        });

        socket.addEventListener('close', () => {
          connected = false;
          setStatus('Connection lost. Reconnecting...');
          setTimeout(connectSocket, 2000);
        });
      }

      function refreshRoom() {
        fetch(`/api/rooms/${encodeURIComponent(roomCode)}`)
          .then((response) => response.json())
          .then((data) => {
            if (data && data.ok && data.state) {
              state.roomCode = data.roomCode || state.roomCode;
              state.players = data.players || [];
              state.phase = data.state.phase || state.phase;
              if (typeof data.state.turn === 'number') state.turn = data.state.turn;
              if (typeof data.state.dice === 'number') state.dice = data.state.dice;
              if (data.state.lastRollBy) state.lastRollBy = data.state.lastRollBy;
              renderGame();
            }
          })
          .catch(() => {
            setStatus('Could not refresh room');
          });
      }

      rollBtn.addEventListener('click', rollDice);
      refreshBtn.addEventListener('click', refreshRoom);
      leaveBtn.addEventListener('click', () => {
        if (socket) socket.close();
        window.location.href = '/';
      });

      if (!roomCode) {
        window.location.href = '/';
      } else {
        state.roomCode = roomCode;
        metaRoom.textContent = roomCode;
        roomCodeLabel.textContent = `ROOM ${roomCode}`;
        setStatus('Connecting to room...');
        renderGame();
        connectSocket();
      }
    </script>
  </body>
</html>
