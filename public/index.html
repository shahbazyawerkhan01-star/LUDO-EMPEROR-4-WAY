<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ludo Emperor 4 Way — Global Multiplayer</title>
    <style>
      :root {
        --bg: #0f172a;
        --bg-2: #111827;
        --panel: #1f2937;
        --text: #f8fafc;
        --muted: #cbd5e1;
        --accent: #f59e0b;
        --success: #22c55e;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        background: radial-gradient(circle at top, #1e293b 0%, var(--bg) 55%);
        color: var(--text);
        font-family: Arial, sans-serif;
        display: grid;
        place-items: center;
      }
      .shell {
        width: min(980px, calc(100vw - 32px));
        background: rgba(17, 24, 39, 0.95);
        border: 1px solid rgba(255,255,255,0.08);
        border-radius: 18px;
        box-shadow: 0 30px 80px rgba(0,0,0,0.45);
        padding: 24px;
      }
      h1 { margin-top: 0; }
      .row {
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
        margin: 18px 0;
      }
      input, button {
        border: none;
        border-radius: 12px;
        padding: 12px 14px;
        font-size: 16px;
      }
      input {
        min-width: 240px;
        background: var(--panel);
        color: var(--text);
      }
      button {
        font-weight: bold;
        cursor: pointer;
        background: var(--accent);
        color: #111827;
      }
      button.secondary {
        background: var(--success);
      }
      .status {
        margin-top: 18px;
        padding: 16px;
        border-radius: 12px;
        background: rgba(148,163,184,.08);
        color: var(--muted);
      }
      .badge {
        display: inline-block;
        padding: 8px 12px;
        border-radius: 999px;
        background: rgba(34,197,94,.12);
        color: #ccfbf1;
        border: 1px solid rgba(34,197,94,.2);
      }
      .players {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        margin-top: 18px;
      }
      .pill {
        padding: 8px 12px;
        border-radius: 999px;
        background: rgba(59,130,246,.12);
        border: 1px solid rgba(59,130,246,.25);
      }
      .game-box {
        margin-top: 20px;
        border: 1px solid rgba(255,255,255,0.08);
        background: rgba(15, 23, 42, 0.7);
        padding: 16px;
        border-radius: 14px;
      }
    </style>
  </head>
  <body>
    <div class="shell">
      <h1>Ludo Emperor 4 Way</h1>
      <p>Play with friends from anywhere in the world using a room code.</p>

      <div class="row">
        <input id="playerName" value="Player" placeholder="Your name" />
        <button id="createRoomBtn">Create room</button>
      </div>

      <div class="row">
        <input id="roomCodeInput" placeholder="Enter room code" maxlength="10" />
        <button id="joinRoomBtn" class="secondary">Join room</button>
      </div>

      <div class="row">
        <span class="badge" id="roomBadge">No room yet</span>
      </div>

      <div id="status" class="status">
        Create a room and share the code with friends. When they join, the room updates live.
      </div>

      <div class="players" id="players"></div>

      <div class="game-box">
        <h3>Live game state</h3>
        <pre id="gameStateBox">{ "phase": "lobby" }</pre>
      </div>
    </div>

    <script>
      const statusEl = document.getElementById('status');
      const roomBadge = document.getElementById('roomBadge');
      const playersEl = document.getElementById('players');
      const roomInputEl = document.getElementById('roomCodeInput');
      const playerInputEl = document.getElementById('playerName');
      const gameBoxEl = document.getElementById('gameStateBox');

      const url = new URL(window.location.href);
      const roomFromQuery = url.searchParams.get('room');
      if (roomFromQuery) roomInputEl.value = roomFromQuery;

      let socket = null;
      let currentRoom = null;
      let currentPlayerName = 'Player';
      let currentPlayerId = null;

      function connectSocket() {
        const wsProtocol = window.location.protocol === 'https:' ? 'wss' : 'ws';
        const wsUrl = `${wsProtocol}://${window.location.host}/ws`;
        socket = new WebSocket(wsUrl);

        socket.addEventListener('open', () => {
          statusEl.textContent = 'Connected to multiplayer server.';
          if (currentRoom && currentPlayerName) {
            socket.send(JSON.stringify({ type: 'join-room', roomCode: currentRoom, playerName: currentPlayerName }));
          }
        });

        socket.addEventListener('message', (event) => {
          try {
            const msg = JSON.parse(event.data);

            if (msg.type === 'joined-room') {
              currentRoom = msg.roomCode;
              currentPlayerId = msg.playerId;
              roomBadge.textContent = `Room: ${msg.roomCode}`;
              roomInputEl.value = msg.roomCode;
              url.searchParams.set('room', msg.roomCode);
              window.history.replaceState({}, '', `${url.pathname}?${url.searchParams.toString()}`);
              renderPlayers(msg.players || []);
              statusEl.textContent = `Joined room ${msg.roomCode}. Share the code with friends.`;
            }

            if (msg.type === 'room-update') {
              renderPlayers(msg.players || []);
              statusEl.textContent = `Players in room ${msg.roomCode}: ${(msg.players || []).length}`;
            }

            if (msg.type === 'game-state') {
              gameBoxEl.textContent = JSON.stringify(msg.state, null, 2);
            }

            if (msg.type === 'chat') {
              statusEl.textContent = `${msg.playerName}: ${msg.message}`;
            }
          } catch (error) {
            console.error('Message parse error:', error);
          }
        });

        socket.addEventListener('close', () => {
          statusEl.textContent = 'Connection lost. Reconnecting...';
        });
      }

      function renderPlayers(players) {
        playersEl.innerHTML = '';
        if (!players || players.length === 0) {
          playersEl.innerHTML = '<span class="pill">No players yet</span>';
          return;
        }
        players.forEach((player) => {
          const pill = document.createElement('span');
          pill.className = 'pill';
          pill.textContent = player.name || 'Player';
          playersEl.appendChild(pill);
        });
      }

      async function createRoom() {
        currentPlayerName = playerInputEl.value.trim() || 'Player';
        const res = await fetch('/api/rooms/create', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ playerName: currentPlayerName })
        });

        const data = await res.json();
        if (!res.ok) {
          statusEl.textContent = data.message || 'Failed to create room';
          return;
        }

        currentRoom = data.roomCode;
        roomInputEl.value = data.roomCode;
        roomBadge.textContent = `Room: ${data.roomCode}`;
        if (!socket || socket.readyState !== WebSocket.OPEN) connectSocket();
        socket.send(JSON.stringify({ type: 'join-room', roomCode: data.roomCode, playerName: currentPlayerName }));
        statusEl.textContent = `Room ${data.roomCode} created. Share it with your friends.`;
      }

      async function joinRoom() {
        currentPlayerName = playerInputEl.value.trim() || 'Player';
        const roomCode = roomInputEl.value.trim().toUpperCase();
        if (!roomCode) {
          statusEl.textContent = 'Type a room code first.';
          return;
        }

        const res = await fetch('/api/rooms/join', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ roomCode, playerName: currentPlayerName })
        });

        const data = await res.json();
        if (!res.ok) {
          statusEl.textContent = data.message || 'Failed to join room';
          return;
        }

        currentRoom = roomCode;
        roomBadge.textContent = `Room: ${roomCode}`;
        if (!socket || socket.readyState !== WebSocket.OPEN) connectSocket();
        socket.send(JSON.stringify({ type: 'join-room', roomCode, playerName: currentPlayerName }));
        statusEl.textContent = `Joined room ${roomCode}. Waiting for players...`;
      }

      document.getElementById('createRoomBtn').addEventListener('click', createRoom);
      document.getElementById('joinRoomBtn').addEventListener('click', joinRoom);
      connectSocket();

      const initialState = { phase: 'lobby', players: [] };
      gameBoxEl.textContent = JSON.stringify(initialState, null, 2);
    </script>
  </body>
</html>
